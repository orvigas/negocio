# Dependabot (REQ-F-020, RF-7). Política en la sección "CI" de restaurante/README.md.
#
# Monorepo (REQ-F-036 a REQ-F-039): npm desde restaurante/, la raíz de los workspaces con el
# package-lock.json único (Dependabot actualiza también el package.json de cada workspace:
# landing-pages, api, inventory-manager y los paquetes de packages/, donde están Prisma y mariadb
# desde REQ-F-037); la imagen base desde restaurante/landing-pages/, donde está el Dockerfile de las
# cuatro imágenes (production, migrate, api e inventory-manager).
#
# - Actualización rutinaria semanal y agrupada; las versiones mayores quedan fuera y se revisan a
#   mano. Se excluyen con `allow` + `update-types`, que según la documentación de GitHub solo
#   afecta a las actualizaciones de versión: las de seguridad se abren siempre, también si son
#   mayores (un `ignore` sí podría bloquearlas).
# - Prisma (`prisma`, `@prisma/*`) y `mariadb` van juntos en el mismo PR (el adaptador fija la
#   versión exacta de `mariadb`). Un PR que suba Prisma también debe actualizar `allowScripts` en
#   el package.json de la raíz, restaurante/package.json (prisma@x.y.z y @prisma/engines@x.y.z):
#   hasta entonces, `npm ci --strict-allow-scripts` lo deja en rojo.
# - Las acciones siguen fijadas por SHA completo; Dependabot actualiza el SHA y el comentario.
# - La imagen base del Dockerfile (`node:24.22.1-alpine`) va fijada a la versión exacta de Node.
#   Dependabot solo propone menores y parches de la línea 24 (las mayores se revisan a mano). Un
#   PR que suba la imagen también debe subir `.nvmrc` y `engines.node` de los package.json que lo
#   declaran (restaurante/, landing-pages/, api/ e inventory-manager/; los de packages/ no lo
#   declaran) a la misma versión: Dependabot no los toca y el CI toma la versión de `.nvmrc`.
# - Sin merge automático: cada merge a main despliega en producción.
version: 2
updates:
  - package-ecosystem: npm
    directory: /restaurante
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: America/Mexico_City
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    allow:
      - dependency-name: "*"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
    groups:
      # El primer grupo que coincide se queda con la dependencia: Prisma va antes que el general.
      prisma:
        applies-to: version-updates
        patterns: ["prisma", "@prisma/*", "mariadb"]
      prisma-seguridad:
        applies-to: security-updates
        patterns: ["prisma", "@prisma/*", "mariadb"]
      semanal:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: America/Mexico_City
    commit-message:
      prefix: "ci(deps)"
    groups:
      acciones:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /restaurante/landing-pages
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: America/Mexico_City
    commit-message:
      prefix: "chore(deps)"
    allow:
      - dependency-name: "*"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
