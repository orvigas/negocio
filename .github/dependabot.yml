# Dependabot (REQ-F-020, RF-7). Política en la sección "CI" de restaurante/README.md.
#
# - Actualización rutinaria mensual (el día 1 de cada mes) y agrupada, para no gastar una ejecución
#   completa del CI cada semana por ecosistema; el grupo general conserva el nombre `semanal` (es el
#   de sus ramas y PR). Las versiones mayores quedan fuera y se revisan a
#   mano. Se excluyen con `allow` + `update-types`, que según la documentación de GitHub solo
#   afecta a las actualizaciones de versión: las de seguridad se abren siempre, también si son
#   mayores (un `ignore` sí podría bloquearlas).
# - Prisma (`prisma`, `@prisma/*`) y `mariadb` van juntos en el mismo PR (el adaptador fija la
#   versión exacta de `mariadb`). Un PR que suba Prisma también debe actualizar `allowScripts` en
#   package.json (prisma@x.y.z y @prisma/engines@x.y.z): hasta entonces, `npm ci
#   --strict-allow-scripts` lo deja en rojo.
# - Las acciones siguen fijadas por SHA completo; Dependabot actualiza el SHA y el comentario.
# - La imagen base del Dockerfile (`node:24.22.1-alpine`) va fijada a la versión exacta de Node.
#   Dependabot solo propone menores y parches de la línea 24 (las mayores se revisan a mano). Un
#   PR que suba la imagen también debe subir `.nvmrc` y `engines.node` de package.json a la misma
#   versión: Dependabot no los toca y el CI toma la versión de `.nvmrc`.
# - Sin merge automático: cada merge a main despliega en producción.
version: 2
updates:
  - package-ecosystem: npm
    directory: /restaurante
    schedule:
      interval: monthly
      time: "07:00"
      timezone: America/Mexico_City
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    allow:
      - dependency-name: "*"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
    groups:
      # El primer grupo que coincide se queda con la dependencia: Prisma va antes que el general.
      prisma:
        applies-to: version-updates
        patterns: ["prisma", "@prisma/*", "mariadb"]
      prisma-seguridad:
        applies-to: security-updates
        patterns: ["prisma", "@prisma/*", "mariadb"]
      semanal:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "07:00"
      timezone: America/Mexico_City
    commit-message:
      prefix: "ci(deps)"
    groups:
      acciones:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /restaurante
    schedule:
      interval: monthly
      time: "07:00"
      timezone: America/Mexico_City
    commit-message:
      prefix: "chore(deps)"
    allow:
      - dependency-name: "*"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
