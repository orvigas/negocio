# CI (REQ-F-006 y REQ-F-014): tipos, lint, pruebas contra MySQL 8.4, divergencia entre esquema y
# migraciones, y build de las imágenes production y migrate en cada PR hacia main o hacia la rama
# intermedia epic/arquitectura (ver "Rama intermedia" más abajo). restaurante/ es la raíz de los
# npm workspaces (REQ-F-036): ahí están .nvmrc, el package-lock.json único y los scripts, que
# delegan en el workspace landing-pages (la app y su Dockerfile) o en los paquetes de packages/
# (REQ-F-037: core, contracts y db; db:generate y las migraciones van a packages/db). typecheck y
# lint cubren todos los workspaces desde la raíz. MySQL es el servicio mysql-dev
# de restaurante/compose.yaml (solo en 127.0.0.1, credenciales de desarrollo): el mismo que en
# local, porque un `services:` de GitHub no permite fijar la colación del servidor.
#
# Solo documentación: el job `cambios` compara los archivos del PR (o del push a main) y, si todos
# son documentación (ver su comentario), calidad, docker, despliegue y auditoria quedan omitidas
# (skipped) en el PR, y en main no se publica ni se despliega nada.
#
# Despliegue (REQ-F-016): las validaciones (calidad, docker, despliegue y auditoria, REQ-F-020)
# corren en los PR. En un push a main con cambios de código, el job `validado` comprueba si el
# árbol (tree) del commit de main es exactamente el que validó una ejecución en verde del PR
# mergeado (ver su comentario): si lo es, `publish` publica las imágenes en GHCR (privado) sin
# repetir las validaciones; si no lo es o no se puede decidir (main avanzó después del CI del PR,
# push directo, error de la API), las cuatro validaciones corren en el push y `publish` solo
# corre si todas quedan en verde. `vigente` comprueba que el commit siga siendo la punta de main
# (si no, resumen "Omitido" y no se despliega) y `deploy` despliega lo publicado en el VPS por SSH,
# en el environment `production`. Redespliegue manual: `workflow_dispatch` sobre main (cualquier
# otra rama se rechaza) corre las cuatro validaciones, publica y despliega la punta de main.
#
# Rama intermedia (epic/arquitectura): los PR de los pasos de restaurante/docs/arquitectura.md van
# a esa rama y corren las mismas validaciones que un PR hacia main, sin publicar ni desplegar
# (`publish` exige push o ejecución manual sobre main). No hay `push` a epic/arquitectura: cada
# merge ya se validó en su PR, y la integración en main pasa por un PR de la épica hacia main, que
# corre su propio CI; al mergearlo, `validado` lo trata como cualquier otro PR hacia main.
#
# Qué se desplegó (REQ-F-030): el título de cada ejecución lleva su commit (ver `run-name`) y el
# resumen de `vigente` (Omitido) o de `deploy` (Desplegado, Revertido, Fallido, Omitido o Cancelado
# o interrumpido) da el estado con el commit enlazado; lo genera restaurante/deploy/ci/resumen.sh. `deploy` solo
# termina en éxito (y Deployments solo registra un despliegue exitoso) si el commit quedó sirviendo.
# Permisos por defecto de solo lectura; `validado` añade lectura de actions, checks y
# pull-requests, y `publish`, packages: write.
# Los únicos secretos son los del environment production (VPS_*), y solo los ve `deploy`.
# Las acciones están fijadas por SHA completo (la versión va en el comentario); para
# actualizarlas, ver la sección "CI" de restaurante/README.md.
name: CI
# Título de cada ejecución con su commit (REQ-F-030). PR: título del PR y SHA de la punta de su rama
# (no el commit de merge de prueba). Manual: "Ejecución manual" y el SHA de main. Push: vacío, así
# GitHub usa el mensaje del commit y escribe debajo el SHA corto enlazado. Las expresiones no pueden
# recortar texto: el SHA va completo; sus 7 primeros caracteres son el SHA corto de los resúmenes.
run-name: ${{ github.event_name == 'pull_request' && format('{0} · {1}', github.event.pull_request.title, github.event.pull_request.head.sha) || github.event_name == 'workflow_dispatch' && format('Ejecución manual · {0}', github.sha) || '' }}

on:
  pull_request:
    branches: [main, epic/arquitectura]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  # Redespliegue manual (Actions > CI > Run workflow). Solo sobre main: `cambios` rechaza otra rama.
  workflow_dispatch:

# Solo lectura del repositorio; ningún otro permiso.
permissions:
  contents: read

# En un PR, un push nuevo cancela la ejecución anterior. Cada push a main tiene su propio
# grupo (el SHA) y cada ejecución manual el suyo (su id): ninguna ejecución de main se cancela ni
# se reemplaza.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'workflow_dispatch' && format('manual-{0}', github.run_id) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Detección de cambios con git, sin acciones de terceros. Es documentación: todo lo de .claude/,
  # restaurante/docs/**.md y cualquier *.md fuera de restaurante/. Cualquier otro archivo (también
  # un borrado o el origen de un renombrado) cuenta como código. Los *.md de restaurante/ fuera de
  # docs/ cuentan como código: landing-pages/tests/unit/whatsapp-bot-free-text.test.ts lee el
  # README.md de la raíz y landing-pages/tests/fixtures/ forma parte de las pruebas. packages/**
  # (REQ-F-037) cuenta como código como cualquier otro archivo que no sea documentación. En un PR
  # compara el commit de merge que prueba GitHub (refs/pull/N/merge) con su primer padre, la punta
  # de su rama base (main o epic/arquitectura): lo que el PR agrega a su base, y deja el tree de
  # ese commit de merge en una anotación `arbol-validado` (la lee `validado` en el push a main). En
  # un push a main, el rango before..sha; si `before` no existe en el historial (force push), corre
  # todo. En una ejecución manual todo es código; fuera de main, falla y no
  # corre nada más.
  cambios:
    name: cambios
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      codigo: ${{ steps.diff.outputs.codigo }}
    steps:
      - name: rama de la ejecución manual
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        env:
          REF: ${{ github.ref }}
        run: |
          echo "::error::La ejecución manual solo se permite sobre main (se pidió $REF)."
          exit 1
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || github.event_name == 'workflow_dispatch' && 1 || 0 }}
      - name: clasificar archivos
        id: diff
        env:
          EVENTO: ${{ github.event_name }}
          ANTES: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENTO" = workflow_dispatch ]; then
            echo "Ejecución manual: se valida, se publica y se despliega la punta de main." >> "$GITHUB_STEP_SUMMARY"
            echo "codigo=true" >> "$GITHUB_OUTPUT"
            exit 0
          elif [ "$EVENTO" = pull_request ]; then
            echo "::notice title=arbol-validado::$(git rev-parse 'HEAD^{tree}')"
            desde=HEAD^1
          elif git cat-file -e "${ANTES}^{commit}" 2>/dev/null; then
            desde=$ANTES
          else
            echo "Sin commit anterior ($ANTES) en el historial: se considera código." >> "$GITHUB_STEP_SUMMARY"
            echo "codigo=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          codigo=false
          while IFS= read -r archivo; do
            case "$archivo" in
              .claude/*) ;;
              restaurante/docs/*.md) ;;
              restaurante/*) codigo=true ;;
              *.md) ;;
              *) codigo=true ;;
            esac
            if [ "$codigo" = true ]; then
              echo "Cambio de código: \`$archivo\`" >> "$GITHUB_STEP_SUMMARY"
              break
            fi
          done < <(git diff --name-only --no-renames "$desde" HEAD)
          [ "$codigo" = true ] || echo "Solo documentación: se omiten las validaciones, la publicación y el despliegue." >> "$GITHUB_STEP_SUMMARY"
          echo "codigo=$codigo" >> "$GITHUB_OUTPUT"

  # Árbol ya validado (solo en un push a main con código). La API de ejecuciones solo da el
  # head_sha de una ejecución de PR (la punta de la rama), no el commit de merge de prueba
  # (refs/pull/N/merge) que validó; por eso `cambios` deja su tree en la anotación
  # `arbol-validado`. Aquí: PR mergeado de este commit (uno solo, base main, merge_commit_sha =
  # este SHA) → ejecuciones del CI con evento pull_request y conclusión success para la punta de
  # ese PR → en alguna, calidad, auditoria, docker y despliegue en success y la anotación de
  # `cambios` igual al tree de este commit. Si coincide, validado=true. Cualquier otra cosa (sin
  # PR, varios PR, error de la API, sin ejecución válida, tree distinto) da validado=false y las
  # validaciones corren en el push. Ante la duda, siempre se valida. Solo cuenta el PR hacia main
  # (al integrar la épica, el de epic/arquitectura → main): un PR hacia epic/arquitectura nunca
  # valida un push a main, salvo que su anotación coincida con el tree exacto de main.
  validado:
    name: validado
    needs: cambios
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.cambios.outputs.codigo == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
    outputs:
      validado: ${{ steps.arbol.outputs.validado }}
    steps:
      - name: comparar árbol con el validado en el PR
        id: arbol
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          repo=$GITHUB_REPOSITORY
          validar() {
            echo "Se valida en este push: $1" >> "$GITHUB_STEP_SUMMARY"
            echo "validado=false" >> "$GITHUB_OUTPUT"
            exit 0
          }
          arbol=$(gh api "repos/$repo/git/commits/$GITHUB_SHA" --jq .tree.sha) || validar "no se pudo leer el tree de $GITHUB_SHA."
          # Nunca comparar vacíos: una anotación ausente ("") no debe coincidir con un tree ilegible.
          [[ "$arbol" =~ ^[0-9a-f]{40}$ ]] || validar "tree de $GITHUB_SHA no válido."
          cabeza=$(gh api "repos/$repo/commits/$GITHUB_SHA/pulls" --jq "[.[] | select(.merged_at != null and .base.ref == \"main\" and .merge_commit_sha == \"$GITHUB_SHA\")] | if length == 1 then .[0].head.sha else \"\" end") \
            || validar "no se pudo consultar el PR de $GITHUB_SHA."
          [ -n "$cabeza" ] || validar "$GITHUB_SHA no es el merge de un único PR hacia main."
          ejecuciones=$(gh api "repos/$repo/actions/workflows/ci.yml/runs?event=pull_request&status=success&head_sha=$cabeza&per_page=100" --jq '.workflow_runs[].id') \
            || validar "no se pudieron consultar las ejecuciones del PR."
          for ejecucion in $ejecuciones; do
            trabajos=$(gh api "repos/$repo/actions/runs/$ejecucion/jobs?filter=latest&per_page=100" --jq '.jobs[] | "\(.name) \(.conclusion) \(.id)"') || continue
            verdes=0
            for nombre in calidad auditoria docker despliegue; do
              grep -Eq "^$nombre success [0-9]+$" <<< "$trabajos" && verdes=$((verdes + 1))
            done
            [ "$verdes" -eq 4 ] || continue
            cambios=$(awk '$1 == "cambios" && $2 == "success" { print $3 }' <<< "$trabajos")
            [ -n "$cambios" ] || continue
            probado=$(gh api "repos/$repo/check-runs/$cambios/annotations" --jq '[.[] | select(.title == "arbol-validado") | .message] | if length == 1 then .[0] else "" end') || continue
            if [ "$probado" = "$arbol" ]; then
              echo "Árbol \`$arbol\` ya validado en la ejecución $ejecucion del PR: se publica sin repetir las validaciones." >> "$GITHUB_STEP_SUMMARY"
              echo "validado=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          validar "ninguna ejecución en verde del PR validó el árbol \`$arbol\` (main avanzó o el PR no pasó el CI)."

  # Las validaciones corren en los PR y en las ejecuciones manuales con cambios de código, y en un
  # push a main solo si `validado` no confirmó el árbol (validado != 'true', también si falló).
  # `!cancelled()` porque `validado` queda omitido (skipped) fuera del push.
  calidad:
    name: calidad
    needs: [cambios, validado]
    if: >-
      !cancelled() && needs.cambios.result == 'success' && needs.cambios.outputs.codigo == 'true'
      && (github.event_name != 'push' || needs.validado.outputs.validado != 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: restaurante
    # CLI de Prisma (REQ-F-007): sin telemetría ni avisos de actualización.
    env:
      CHECKPOINT_DISABLE: '1'
      PRISMA_HIDE_UPDATE_MESSAGE: '1'
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: setup-node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: restaurante/.nvmrc
          cache: npm
          cache-dependency-path: restaurante/package-lock.json
      # Solo corren los scripts de instalación aprobados en `allowScripts` (package.json).
      - name: install
        run: npm ci --strict-allow-scripts --no-audit --no-fund
      # Cliente de Prisma (packages/db/src/generated/prisma, no versionado; REQ-F-037): lo necesitan
      # typecheck, lint y test.
      - name: db:generate
        run: npm run db:generate
      - name: typecheck
        run: npm run typecheck
      - name: lint
        run: npm run lint
      # Las pruebas leen el CSS generado (public/css/<negocio>/main.css), que no se versiona.
      - name: build:css
        run: npm run build:css
      # MySQL 8.4 local (utf8mb4 + utf8mb4_es_0900_as_cs) para la divergencia y las pruebas.
      - name: db:up
        run: npm run db:up
      # El esquema y las migraciones no divergen (base sombra del MySQL local).
      # En el paquete db (su prisma.config.ts y prisma/; REQ-F-037), con el CLI elevado a la raíz.
      - name: migraciones sin divergencia
        working-directory: restaurante/packages/db
        env:
          SHADOW_DATABASE_URL: mysql://restaurante_migrator:migrator-dev@127.0.0.1:3307/restaurante_shadow
        run: ../../node_modules/.bin/prisma migrate diff --from-migrations prisma/migrations --to-schema prisma/schema.prisma --exit-code
      # Usa las URL de prueba por defecto (TEST_DATABASE_URL/TEST_ADMIN_DATABASE_URL hacia 127.0.0.1:3307).
      - name: test
        run: npm test

  # Auditoría de dependencias por imagen (REQ-F-020): npm audit sobre package-lock.json en los cortes
  # production (--omit=dev --omit=optional), migrate (--omit=dev) y desarrollo. Rompe con un aviso
  # high o critical en production o migrate sin excepción vigente (security/audit-exceptions.json),
  # con una excepción inválida o vencida, o si el registro de npm no responde (fail closed: relanzar
  # el job). Sin npm ci: no ejecuta código de dependencias. El resumen va al resumen del job.
  auditoria:
    name: auditoria
    needs: [cambios, validado]
    if: >-
      !cancelled() && needs.cambios.result == 'success' && needs.cambios.outputs.codigo == 'true'
      && (github.event_name != 'push' || needs.validado.outputs.validado != 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: restaurante
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: setup-node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: restaurante/.nvmrc
      # Delega en landing-pages/scripts/audit-deps.ts, que audita el lockfile de la raíz.
      - name: audit:deps
        run: npm run audit:deps

  docker:
    name: docker
    needs: [cambios, validado]
    if: >-
      !cancelled() && needs.cambios.result == 'success' && needs.cambios.outputs.codigo == 'true'
      && (github.event_name != 'push' || needs.validado.outputs.validado != 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: setup-buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Sin push (se carga en el runner para las comprobaciones): la etapa build ejecuta npm run typecheck.
      - name: build production
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: restaurante
          file: restaurante/landing-pages/Dockerfile
          target: production
          platforms: linux/amd64
          push: false
          provenance: false
          cache-from: type=gha,scope=production
          cache-to: type=gha,scope=production,mode=max
          load: true
          tags: restaurante:production
      # Imagen del proceso de migraciones (REQ-F-014, RF-15).
      - name: build migrate
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: restaurante
          file: restaurante/landing-pages/Dockerfile
          target: migrate
          platforms: linux/amd64
          push: false
          provenance: false
          cache-from: type=gha,scope=migrate
          cache-to: type=gha,scope=migrate,mode=max
          load: true
          tags: restaurante:migrate
      # Imagen de la API propia (REQ-F-038): solo lectura, red interna.
      - name: build api
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: restaurante
          file: restaurante/landing-pages/Dockerfile
          target: api
          platforms: linux/amd64
          push: false
          provenance: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
          load: true
          tags: restaurante:api
      # CA-13: production sin el CLI de Prisma ni SQLite; migrate sin SQLite. Rutas absolutas en todos
      # los niveles de node_modules del workspace (REQ-F-036 y REQ-F-037): /app (elevadas),
      # /app/landing-pages y los paquetes de /app/packages. REQ-F-037 (CA-12): production lleva el
      # cliente generado y las migraciones en /app/packages/db; migrate conserva prisma.config.ts,
      # schema y migraciones en su WORKDIR (/app/landing-pages), como espera deploy/ci/smoke.sh.
      - name: contenido de las imágenes
        run: |
          docker run --rm --entrypoint sh restaurante:production -c 'for d in /app/node_modules /app/landing-pages/node_modules /app/packages/core/node_modules /app/packages/db/node_modules; do test ! -e "$d/prisma" && test ! -e "$d/better-sqlite3" && test ! -e "$d/@prisma/adapter-better-sqlite3" || exit 1; done; test -e /app/node_modules/@prisma/adapter-mariadb && test -d /app/packages/db/prisma/migrations && test -e /app/packages/db/src/generated/prisma/client.ts'
          docker run --rm --entrypoint sh restaurante:migrate -c 'test -e /app/node_modules/prisma && for d in /app/node_modules /app/landing-pages/node_modules /app/packages/db/node_modules; do test ! -e "$d/better-sqlite3" || exit 1; done; test "$(pwd)" = /app/landing-pages && test -e prisma.config.ts && test -e prisma/schema.prisma && test -d prisma/migrations'
          # REQ-F-038 (CA-11, O-3): production y api llevan el código de contracts y Zod resoluble;
          # api, sin el CLI de Prisma, con el cliente generado, las migraciones y su WORKDIR /app/api.
          docker run --rm --entrypoint sh restaurante:production -c 'test -e /app/packages/contracts/index.ts && node -e "import(\"@restaurante/contracts\").then((m) => process.exit(typeof m.createPublicApiClient === \"function\" ? 0 : 1))"'
          docker run --rm --entrypoint sh restaurante:api -c 'test "$(pwd)" = /app/api && test -e src/server.ts && test -e /app/packages/contracts/index.ts && test -e /app/packages/core/catalog/index.ts && test -e /app/packages/db/src/generated/prisma/client.ts && test -d /app/packages/db/prisma/migrations && for d in /app/node_modules /app/api/node_modules /app/packages/db/node_modules; do test ! -e "$d/prisma" || exit 1; done && node -e "import(\"zod\").then(() => process.exit(0))"'
          # REQ-F-039 (P-1 y RF-11): production y api llevan packages/web; api, la copia de las imágenes
          # de las landings en la misma ruta relativa (PRODUCT_IMAGES_DIR por defecto).
          docker run --rm --entrypoint sh restaurante:production -c 'node -e "import(\"@restaurante/web\").then((m) => process.exit(typeof m.createRenderer === \"function\" ? 0 : 1))"'
          docker run --rm --entrypoint sh restaurante:api -c 'node -e "import(\"@restaurante/web\").then((m) => process.exit(typeof m.createLogger === \"function\" ? 0 : 1))" && ls /app/landing-pages/public/img/molotes/*.jpg >/dev/null'
      # CA-13: la imagen migrate aplica el esquema sobre una base vacía con código 0.
      - name: migrate sobre una base vacía
        working-directory: restaurante
        run: |
          docker compose up -d --wait mysql-dev
          docker compose exec -T mysql-dev sh -c 'mysql -uroot -p"$MYSQL_ROOT_PASSWORD" -e "CREATE DATABASE restaurante_test_ci CHARACTER SET utf8mb4 COLLATE utf8mb4_es_0900_as_cs"'
          docker run --rm --network restaurante_db-test \
            -e MIGRATION_DATABASE_URL=mysql://restaurante_test_admin:test-dev@mysql-dev:3306/restaurante_test_ci \
            restaurante:migrate
      # CA-9 (REQ-F-015): la imagen production, sin HOST al ejecutar, escucha en 0.0.0.0 dentro del
      # contenedor (HOST de la imagen), el HEALTHCHECK queda healthy y la landing responde por el
      # puerto publicado. La red db-test es interna (no publica puertos): el contenedor se crea en la
      # red por defecto y se conecta además a db-test antes de arrancar. Usa la base migrada del paso
      # anterior con el usuario solo DML de pruebas; números de WhatsApp ficticios.
      - name: imagen production escucha en 0.0.0.0 y queda healthy
        working-directory: restaurante
        run: |
          # REQ-F-038 (CA-11): la API en la red interna db-test, healthy y sin puertos publicados.
          docker run -d --name api-ca11 --network restaurante_db-test \
            -e DATABASE_URL=mysql://restaurante_test_app:test-dev@mysql-dev:3306/restaurante_test_ci \
            restaurante:api
          api_health=starting
          for _ in $(seq 1 60); do
            api_health=$(docker inspect -f '{{.State.Health.Status}}' api-ca11)
            [ "$api_health" = healthy ] && break
            [ "$(docker inspect -f '{{.State.Running}}' api-ca11)" = true ] || break
            sleep 2
          done
          if [ "$api_health" != healthy ]; then
            echo "La api no quedó healthy (estado: $api_health)"
            docker logs api-ca11
            exit 1
          fi
          docker logs api-ca11 | grep '"msg":"server_started"' | grep -q '"service":"api"' || { docker logs api-ca11; exit 1; }
          docker create --name app-ca9 -p 127.0.0.1:3000:3000 \
            -e DATABASE_URL=mysql://restaurante_test_app:test-dev@mysql-dev:3306/restaurante_test_ci \
            -e DATA_DIR=/var/lib/restaurante \
            -e WHATSAPP_MOLOTES=5210000000001 \
            -e WHATSAPP_BIRRIA=5210000000002 \
            -e API_INTERNAL_URL=http://api-ca11:3001 \
            restaurante:production
          docker network connect restaurante_db-test app-ca9
          docker start app-ca9
          health=starting
          for _ in $(seq 1 60); do
            health=$(docker inspect -f '{{.State.Health.Status}}' app-ca9)
            [ "$health" = healthy ] && break
            [ "$(docker inspect -f '{{.State.Running}}' app-ca9)" = true ] || break
            sleep 2
          done
          if [ "$health" != healthy ]; then
            echo "El contenedor no quedó healthy (estado: $health)"
            docker logs app-ca9
            exit 1
          fi
          docker logs app-ca9 | grep '"msg":"server_started"' | grep -q '"host":"0.0.0.0"' || { docker logs app-ca9; exit 1; }
          curl -fsS -o /dev/null http://127.0.0.1:3000/molotes
          # Las landings cargaron los productos de la API (no de la semilla).
          docker logs app-ca9 | grep '"msg":"landing_products_loaded"' | grep -q '"source":"api"' || { docker logs app-ca9; exit 1; }
          docker rm -f app-ca9 api-ca11

  # Prueba de humo del despliegue (REQ-F-016): deploy/deploy.sh contra el compose de producción, un
  # Traefik v3 y un registro local (CA-2, CA-3, CA-4, CA-5, CA-7, CA-8, CA-9 y D-1). Sin secretos.
  despliegue:
    name: despliegue
    needs: [cambios, validado]
    if: >-
      !cancelled() && needs.cambios.result == 'success' && needs.cambios.outputs.codigo == 'true'
      && (github.event_name != 'push' || needs.validado.outputs.validado != 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck
        working-directory: restaurante/deploy
        run: shellcheck deploy.sh mysql/initdb/01-usuarios.sh ci/smoke.sh ci/resumen.sh ci/resumen-test.sh
      # Resumen del despliegue (REQ-F-030): cada estado con entradas simuladas.
      - name: prueba del resumen
        run: bash restaurante/deploy/ci/resumen-test.sh
      # Respaldos (REQ-F-019): scripts y unidades de systemd de restaurante/ops/backup.
      - name: shellcheck respaldos
        working-directory: restaurante/ops/backup
        run: shellcheck -x lib.sh backup.sh env-backup.sh restore.sh verify-backup.sh ci/smoke.sh
      - name: systemd respaldos
        run: |
          sudo install -d /opt/restaurante/ops/backup
          sudo install -m 755 restaurante/ops/backup/*.sh /opt/restaurante/ops/backup/
          systemd-analyze verify restaurante/ops/backup/systemd/*.service restaurante/ops/backup/systemd/*.timer restaurante/ops/backup/systemd/*.path
      - name: setup-buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Solo lee la caché del job docker (no la escribe: evita pisar sus entradas).
      - name: build production
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: restaurante
          file: restaurante/landing-pages/Dockerfile
          target: production
          platforms: linux/amd64
          push: false
          provenance: false
          cache-from: type=gha,scope=production
          load: true
          tags: restaurante:production
      - name: build migrate
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: restaurante
          file: restaurante/landing-pages/Dockerfile
          target: migrate
          platforms: linux/amd64
          push: false
          provenance: false
          cache-from: type=gha,scope=migrate
          load: true
          tags: restaurante:migrate
      - name: build api
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: restaurante
          file: restaurante/landing-pages/Dockerfile
          target: api
          platforms: linux/amd64
          push: false
          provenance: false
          cache-from: type=gha,scope=api
          load: true
          tags: restaurante:api
      - name: prueba de humo
        run: bash restaurante/deploy/ci/smoke.sh restaurante:production restaurante:migrate restaurante:api
      - name: age
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends age
      - name: prueba de humo de respaldos
        run: bash restaurante/ops/backup/ci/smoke.sh restaurante:production restaurante:migrate

  # Publicación en GHCR (REQ-F-016, RF-3): en main (push o ejecución manual) con cambios de código,
  # y solo si el árbol ya estaba validado (`validado`, solo en push) o las cuatro validaciones de
  # esta ejecución quedaron en success. Una validación fallida, cancelada u omitida sin árbol
  # validado impide publicar. Las imágenes se identifican por digest (salidas del job) y se
  # etiquetan con el SHA del commit.
  publish:
    name: publish
    needs: [cambios, validado, calidad, auditoria, docker, despliegue]
    if: >-
      !cancelled() && github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && needs.cambios.result == 'success' && needs.cambios.outputs.codigo == 'true'
      && ((github.event_name == 'push' && needs.validado.outputs.validado == 'true')
        || (needs.calidad.result == 'success' && needs.auditoria.result == 'success'
          && needs.docker.result == 'success' && needs.despliegue.result == 'success'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      app-digest: ${{ steps.app.outputs.digest }}
      migrate-digest: ${{ steps.migrate.outputs.digest }}
      api-digest: ${{ steps.api.outputs.digest }}
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: setup-buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: login ghcr
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: publish production
        id: app
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: restaurante
          file: restaurante/landing-pages/Dockerfile
          target: production
          platforms: linux/amd64
          push: true
          provenance: false
          cache-from: type=gha,scope=production
          tags: ghcr.io/orvigas/restaurante:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: publish migrate
        id: migrate
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: restaurante
          file: restaurante/landing-pages/Dockerfile
          target: migrate
          platforms: linux/amd64
          push: true
          provenance: false
          cache-from: type=gha,scope=migrate
          tags: ghcr.io/orvigas/restaurante-migrate:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      # API propia (REQ-F-038).
      - name: publish api
        id: api
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: restaurante
          file: restaurante/landing-pages/Dockerfile
          target: api
          platforms: linux/amd64
          push: true
          provenance: false
          cache-from: type=gha,scope=api
          tags: ghcr.io/orvigas/restaurante-api:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  # Commit vigente de main (REQ-F-030, RF-3): si mientras tanto llegó otro commit a main, este no se
  # despliega (lo hará la ejecución del siguiente). También en una ejecución manual. Sin environment
  # ni secretos: un commit omitido deja `deploy` omitido (skipped), sin registro en Deployments, y
  # su resumen "Omitido" queda en este job. Si la API falla, el job falla y `deploy` no corre.
  vigente:
    name: vigente
    needs: publish
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      deploy: ${{ steps.head.outputs.deploy }}
      main: ${{ steps.head.outputs.main }}
    steps:
      - name: commit vigente de main
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)
          if ! [[ "$head" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::La API no devolvió un commit válido para main."
            exit 1
          fi
          echo "main=$head" >> "$GITHUB_OUTPUT"
          if [ "$head" = "$GITHUB_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi
      - name: checkout
        if: steps.head.outputs.deploy == 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: restaurante/deploy/ci
      - name: resumen
        if: steps.head.outputs.deploy == 'false'
        env:
          MAIN_SHA: ${{ steps.head.outputs.main }}
        run: bash restaurante/deploy/ci/resumen.sh vigente >> "$GITHUB_STEP_SUMMARY"

  # Despliegue en el VPS (REQ-F-016, RF-4 a RF-6). La llave SSH solo puede ejecutar
  # /opt/restaurante/deploy/deploy.sh (comando forzado en authorized_keys): este job le pasa el SHA,
  # los tres digests (app, migrate y api; REQ-F-038) y la suma de restaurante/deploy, que debe coincidir con la instalada. Solo corre
  # si `vigente` confirmó que el commit es la punta de main. Su resumen (REQ-F-030,
  # deploy/ci/resumen.sh) se escribe siempre: Desplegado, Revertido (código 21), Fallido, Omitido o
  # Cancelado o interrumpido; el job solo termina en éxito si quedó Desplegado.
  deploy:
    name: deploy
    needs: [publish, vigente]
    # Explícito: con la condición implícita (success()) se omitiría cuando `publish` corre con
    # validaciones omitidas (árbol ya validado), porque cuenta toda la cadena de dependencias.
    if: >-
      ${{ !cancelled() && needs.publish.result == 'success' && needs.vigente.result == 'success'
      && needs.vigente.outputs.deploy == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: production
      url: https://birriaelmuneco.com
    # Un solo despliegue a la vez; uno pendiente espera (nunca se cancela el que está en curso).
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: restaurante/deploy
      # Segunda comprobación, justo antes del SSH: main pudo avanzar mientras este job esperaba al
      # despliegue en curso, o se volvió a ejecutar solo `deploy` de un commit antiguo. El job falla
      # (sin tocar el VPS) para que Deployments nunca lo registre como desplegado.
      - name: commit vigente de main
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)
          if ! [[ "$head" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::La API no devolvió un commit válido para main."
            exit 1
          fi
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "main=$head" >> "$GITHUB_OUTPUT"
            echo "omitido=true" >> "$GITHUB_OUTPUT"
            echo "::error::main ya está en $head: no se despliega $GITHUB_SHA."
            exit 1
          fi
      # Menos tiempo que el job, para que un SSH colgado agote el del paso y el resumen corra.
      - name: desplegar
        id: ssh
        timeout-minutes: 17
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
          APP_DIGEST: ${{ needs.publish.outputs.app-digest }}
          MIGRATE_DIGEST: ${{ needs.publish.outputs.migrate-digest }}
          API_DIGEST: ${{ needs.publish.outputs.api-digest }}
        run: |
          set -eu
          umask 077
          dir=$(mktemp -d)
          trap 'rm -rf "$dir"' EXIT
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$dir/key"
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > "$dir/known_hosts"
          # La misma suma que calcula deploy.sh sobre los archivos instalados.
          sum=$(cd restaurante/deploy && sha256sum -- compose.prod.yaml deploy.sh mysql/initdb/01-usuarios.sh | sha256sum | cut -c1-64)
          # El código de deploy.sh (o 255 de ssh) va al resumen; el paso falla con el mismo código.
          rc=0
          ssh -i "$dir/key" -p "${VPS_SSH_PORT:-22}" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$dir/known_hosts" -o ServerAliveInterval=30 -o ConnectTimeout=20 \
            "$VPS_SSH_USER@$VPS_HOST" "deploy $GITHUB_SHA $APP_DIGEST $MIGRATE_DIGEST $API_DIGEST $sum" || rc=$?
          echo "codigo=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"
      # Siempre, sin secretos. Solo informa: el estado del job lo decide `desplegar`.
      - name: resumen
        if: ${{ always() }}
        env:
          OMITIDO: ${{ steps.head.outputs.omitido }}
          MAIN_SHA: ${{ steps.head.outputs.main }}
          SSH_OUTCOME: ${{ steps.ssh.outcome }}
          SSH_CODE: ${{ steps.ssh.outputs.codigo }}
          JOB_STATUS: ${{ job.status }}
          APP_DIGEST: ${{ needs.publish.outputs.app-digest }}
          MIGRATE_DIGEST: ${{ needs.publish.outputs.migrate-digest }}
          API_DIGEST: ${{ needs.publish.outputs.api-digest }}
        run: |
          if [ -f restaurante/deploy/ci/resumen.sh ]; then
            bash restaurante/deploy/ci/resumen.sh deploy >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### Fallido"
              echo
              echo "- commit: [\`${GITHUB_SHA:0:7}\`]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA) (\`$GITHUB_SHA\`)"
              echo "- El despliegue no empezó (falló el checkout): producción no se tocó."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
