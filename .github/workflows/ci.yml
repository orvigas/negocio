# CI (REQ-F-006): tipos, lint, pruebas y build de la imagen production en cada PR hacia
# main y en cada push a main. Sin secretos y con permisos de solo lectura.
# Las acciones están fijadas por SHA completo (la versión va en el comentario); para
# actualizarlas, ver la sección "CI" de restaurante/README.md.
name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

# Solo lectura del repositorio; ningún otro permiso.
permissions:
  contents: read

# En un PR, un push nuevo cancela la ejecución anterior. Cada push a main tiene su propio
# grupo (el SHA): ninguna ejecución de main se cancela ni se reemplaza.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  calidad:
    name: calidad
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: restaurante
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: setup-node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: restaurante/.nvmrc
          cache: npm
          cache-dependency-path: restaurante/package-lock.json
      - name: install
        run: npm ci --no-audit --no-fund
      - name: typecheck
        run: npm run typecheck
      - name: lint
        run: npm run lint
      # Las pruebas leen el CSS generado (public/css/<negocio>/main.css), que no se versiona.
      - name: build:css
        run: npm run build:css
      - name: test
        run: npm test

  docker:
    name: docker
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: setup-buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Solo construye (sin push ni load): la etapa build ejecuta npm run typecheck.
      - name: build production
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: restaurante
          target: production
          platforms: linux/amd64
          push: false
          provenance: false
          cache-from: type=gha,scope=production
          cache-to: type=gha,scope=production,mode=max
