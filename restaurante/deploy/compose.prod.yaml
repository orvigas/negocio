# Compose de producción (REQ-F-016). Lo usa solo deploy/deploy.sh en el VPS, instalado por root en
# /opt/restaurante/deploy/ (solo lectura para el usuario deploy). Detrás del Traefik existente
# (red externa traefik-public). Ningún servicio publica puertos en el host (CA-3).
#
# Variables (interpolación): /opt/restaurante/.env (permisos 600; plantilla en
# env.production.example). Las imágenes (RESTAURANTE_APP_IMAGE, RESTAURANTE_MIGRATE_IMAGE,
# RESTAURANTE_API_IMAGE y RESTAURANTE_INVENTORY_IMAGE, por digest) las pone deploy.sh en el entorno y
# quedan registradas en /opt/restaurante/state/release.env.
# Para consultar a mano (como deploy, desde /opt/restaurante):
#   docker compose -f deploy/compose.prod.yaml --env-file .env --env-file state/release.env ps
#
# La app recibe solo su lista explícita de variables (D-6): nunca la contraseña root de MySQL.
name: restaurante

x-logging: &logging
  # Rotación de logs (D-4): el log de peticiones lleva la IP del cliente, un dato personal.
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

services:
  mysql:
    # MySQL 8.4 LTS fijado por digest (el mismo de compose.yaml).
    image: mysql:8.4@sha256:6ea90827b1100f8f2ae306a539f86d2c264a26ed435a2a9f75551dd5c3aeb242
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_es_0900_as_cs
      - --default-time-zone=+00:00
      - --skip-log-bin
      - --mysqlx=OFF
      # Una espera de bloqueo corta antes de que la transacción de Prisma la dé por perdida (src/db/client.ts).
      - --innodb-lock-wait-timeout=10
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Falta MYSQL_ROOT_PASSWORD en .env}
      # Solo los usa mysql/initdb/01-usuarios.sh (volumen vacío) y el volcado (usuario de respaldo).
      RESTAURANTE_DB_APP_PASSWORD: ${RESTAURANTE_DB_APP_PASSWORD:?Falta RESTAURANTE_DB_APP_PASSWORD en .env}
      RESTAURANTE_DB_MIGRATOR_PASSWORD: ${RESTAURANTE_DB_MIGRATOR_PASSWORD:?Falta RESTAURANTE_DB_MIGRATOR_PASSWORD en .env}
      RESTAURANTE_DB_BACKUP_PASSWORD: ${RESTAURANTE_DB_BACKUP_PASSWORD:?Falta RESTAURANTE_DB_BACKUP_PASSWORD en .env}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/initdb:/docker-entrypoint-initdb.d:ro
    networks:
      - db
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      start_period: 120s
      start_interval: 2s
      retries: 5
    restart: unless-stopped
    logging: *logging

  app:
    image: ${RESTAURANTE_APP_IMAGE:?Falta RESTAURANTE_APP_IMAGE (la pone deploy.sh)}
    environment:
      # Fijadas aquí (RF-1).
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      TRUST_PROXY: "true"
      DATA_DIR: /var/lib/restaurante
      # Usuario solo DML. Contraseña en hexadecimal (openssl rand -hex 32): no necesita codificarse.
      DATABASE_URL: mysql://restaurante_app:${RESTAURANTE_DB_APP_PASSWORD:?Falta RESTAURANTE_DB_APP_PASSWORD en .env}@mysql:3306/restaurante
      # Solo la pone deploy.sh al volver a la versión anterior (D-1); nunca en .env.
      DATABASE_ALLOW_NEWER_SCHEMA: ${DATABASE_ALLOW_NEWER_SCHEMA:-false}
      BUSINESS_TIMEZONE: ${BUSINESS_TIMEZONE:-America/Mexico_City}
      SITE_URL: ${SITE_URL:-}
      # API propia por la red interna db (REQ-F-038): las landings leen de ella los productos.
      API_INTERNAL_URL: http://api:3001
      # Admin nuevo (REQ-F-039): con ADMIN_NEW_URL, la edición de productos de /admin queda en solo
      # lectura y enlaza ahí. El aviso interno de la API llega al puerto 3002 (red db; Traefik solo
      # enruta el 3000) con la credencial compartida.
      ADMIN_NEW_URL: https://${RESTAURANTE_ADMIN_DOMAIN:?Falta RESTAURANTE_ADMIN_DOMAIN en .env}
      INTERNAL_PORT: "3002"
      INTERNAL_NOTIFY_TOKEN: ${RESTAURANTE_INTERNAL_NOTIFY_TOKEN:?Falta RESTAURANTE_INTERNAL_NOTIFY_TOKEN en .env}
      WHATSAPP_MOLOTES_URL: ${WHATSAPP_MOLOTES_URL:-}
      WHATSAPP_MOLOTES: ${WHATSAPP_MOLOTES:-}
      WHATSAPP_MOLOTES_MESSAGE: ${WHATSAPP_MOLOTES_MESSAGE:-}
      WHATSAPP_BIRRIA_URL: ${WHATSAPP_BIRRIA_URL:-}
      WHATSAPP_BIRRIA: ${WHATSAPP_BIRRIA:-}
      WHATSAPP_BIRRIA_MESSAGE: ${WHATSAPP_BIRRIA_MESSAGE:-}
      WHATSAPP_BOT_PROVIDER: ${WHATSAPP_BOT_PROVIDER:-}
      WHATSAPP_BOT_ACCOUNT_ID: ${WHATSAPP_BOT_ACCOUNT_ID:-}
      WHATSAPP_BOT_ACCESS_TOKEN: ${WHATSAPP_BOT_ACCESS_TOKEN:-}
      WHATSAPP_BOT_STAFF_MOLOTES: ${WHATSAPP_BOT_STAFF_MOLOTES:-}
      WHATSAPP_BOT_STAFF_BIRRIA: ${WHATSAPP_BOT_STAFF_BIRRIA:-}
      WHATSAPP_BOT_STAFF_TEMPLATE: ${WHATSAPP_BOT_STAFF_TEMPLATE:-}
      WHATSAPP_BOT_APP_SECRET: ${WHATSAPP_BOT_APP_SECRET:-}
      WHATSAPP_BOT_VERIFY_TOKEN: ${WHATSAPP_BOT_VERIFY_TOKEN:-}
      WHATSAPP_BOT_STAFF_TEMPLATE_LANGUAGE: ${WHATSAPP_BOT_STAFF_TEMPLATE_LANGUAGE:-}
      WHATSAPP_GRAPH_API_VERSION: ${WHATSAPP_GRAPH_API_VERSION:-}
      # Protección del bot (REQ-F-025). La clave es secreta (D-T1); los umbrales vacíos usan los valores por defecto.
      WHATSAPP_BOT_BLOCKLIST_KEY: ${WHATSAPP_BOT_BLOCKLIST_KEY:-}
      WHATSAPP_BOT_BLOCKLIST_KEY_PREVIOUS: ${WHATSAPP_BOT_BLOCKLIST_KEY_PREVIOUS:-}
      BOT_LIMIT_ORDERS_PER_NUMBER_DAY: ${BOT_LIMIT_ORDERS_PER_NUMBER_DAY:-}
      BOT_LIMIT_MESSAGES_PER_NUMBER_DAY: ${BOT_LIMIT_MESSAGES_PER_NUMBER_DAY:-}
      BOT_LIMIT_MESSAGES_PER_MINUTE: ${BOT_LIMIT_MESSAGES_PER_MINUTE:-}
      BOT_LIMIT_BURST: ${BOT_LIMIT_BURST:-}
      BOT_LIMIT_BURST_WINDOW_SECONDS: ${BOT_LIMIT_BURST_WINDOW_SECONDS:-}
      BOT_LIMIT_TEMPLATES_DAY: ${BOT_LIMIT_TEMPLATES_DAY:-}
      BOT_LIMIT_TEMPLATES_MONTH: ${BOT_LIMIT_TEMPLATES_MONTH:-}
      BOT_LIMIT_OUTBOUND_DAY: ${BOT_LIMIT_OUTBOUND_DAY:-}
      BOT_LIMIT_OUTBOUND_MONTH: ${BOT_LIMIT_OUTBOUND_MONTH:-}
      BOT_BUDGET_MONTH_USD: ${BOT_BUDGET_MONTH_USD:-}
      BOT_COST_UTILITY_USD: ${BOT_COST_UTILITY_USD:-}
      BOT_COST_SERVICE_USD: ${BOT_COST_SERVICE_USD:-}
      BOT_FREE_SERVICE_MONTH: ${BOT_FREE_SERVICE_MONTH:-}
      BOT_REPEAT_COUNT: ${BOT_REPEAT_COUNT:-}
      BOT_REPEAT_WINDOW_MINUTES: ${BOT_REPEAT_WINDOW_MINUTES:-}
      BOT_COOLDOWN_MINUTES: ${BOT_COOLDOWN_MINUTES:-}
      BOT_BLOCK_CAP_DAYS: ${BOT_BLOCK_CAP_DAYS:-}
      BOT_BLOCK_REPEAT_STEPS_HOURS: ${BOT_BLOCK_REPEAT_STEPS_HOURS:-}
      BOT_BLOCK_HISTORY_DAYS: ${BOT_BLOCK_HISTORY_DAYS:-}
      BOT_AUDIT_RETENTION_MONTHS: ${BOT_AUDIT_RETENTION_MONTHS:-}
      BOT_QUEUE_MAX: ${BOT_QUEUE_MAX:-}
      BOT_CONTROL_REFRESH_SECONDS: ${BOT_CONTROL_REFRESH_SECONDS:-}
      ADMIN_USER: ${ADMIN_USER:-}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
    volumes:
      - app-data:/var/lib/restaurante
    networks:
      - db
      - traefik
    depends_on:
      mysql:
        condition: service_healthy
    # Una sola réplica: sesiones, límite de intentos y conversaciones del bot viven en memoria.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
    restart: unless-stopped
    # Sobrescribe el HEALTHCHECK de la imagen: comprueba cada 2 s mientras arranca (la conexión a la
    # base puede tardar hasta 60 s) y cada 30 s después. Traefik solo enruta a contenedores healthy.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
      start_interval: 2s
    logging: *logging
    labels:
      - "traefik.enable=true"
      # Imprescindible: la app está en dos redes y Traefik solo llega por traefik-public.
      - "traefik.docker.network=traefik-public"
      - "traefik.http.services.restaurante.loadbalancer.server.port=3000"
      # HTTPS en el dominio raíz (RF-2). Sin HSTS: lo envía la app (helmet).
      - "traefik.http.routers.restaurante.rule=Host(`${RESTAURANTE_DOMAIN:?Falta RESTAURANTE_DOMAIN en .env}`)"
      - "traefik.http.routers.restaurante.entrypoints=${TRAEFIK_ENTRYPOINT_HTTPS:-websecure}"
      - "traefik.http.routers.restaurante.tls=true"
      - "traefik.http.routers.restaurante.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}"
      - "traefik.http.routers.restaurante.service=restaurante"
      # /admin con límite de peticiones por IP: 10 por minuto y ráfaga de 20 (CA-4).
      - "traefik.http.routers.restaurante-admin.rule=Host(`${RESTAURANTE_DOMAIN}`) && (Path(`/admin`) || PathPrefix(`/admin/`))"
      - "traefik.http.routers.restaurante-admin.priority=100"
      - "traefik.http.routers.restaurante-admin.entrypoints=${TRAEFIK_ENTRYPOINT_HTTPS:-websecure}"
      - "traefik.http.routers.restaurante-admin.tls=true"
      - "traefik.http.routers.restaurante-admin.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}"
      - "traefik.http.routers.restaurante-admin.middlewares=restaurante-admin-ratelimit"
      - "traefik.http.routers.restaurante-admin.service=restaurante"
      - "traefik.http.middlewares.restaurante-admin-ratelimit.ratelimit.average=10"
      - "traefik.http.middlewares.restaurante-admin-ratelimit.ratelimit.period=1m"
      - "traefik.http.middlewares.restaurante-admin-ratelimit.ratelimit.burst=20"
      # https://www -> 301 al dominio raíz (con su propio certificado).
      - "traefik.http.routers.restaurante-www.rule=Host(`www.${RESTAURANTE_DOMAIN}`)"
      - "traefik.http.routers.restaurante-www.entrypoints=${TRAEFIK_ENTRYPOINT_HTTPS:-websecure}"
      - "traefik.http.routers.restaurante-www.tls=true"
      - "traefik.http.routers.restaurante-www.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}"
      - "traefik.http.routers.restaurante-www.middlewares=restaurante-canonical"
      - "traefik.http.routers.restaurante-www.service=restaurante"
      # http (raíz y www) -> 301 a https en la raíz, aunque Traefik no tenga redirección global.
      - "traefik.http.routers.restaurante-http.rule=Host(`${RESTAURANTE_DOMAIN}`) || Host(`www.${RESTAURANTE_DOMAIN}`)"
      - "traefik.http.routers.restaurante-http.entrypoints=${TRAEFIK_ENTRYPOINT_HTTP:-web}"
      - "traefik.http.routers.restaurante-http.middlewares=restaurante-canonical"
      - "traefik.http.routers.restaurante-http.service=restaurante"
      # Conserva ruta y query. Los puntos del dominio no se escapan: los routers ya filtran el Host.
      - 'traefik.http.middlewares.restaurante-canonical.redirectregex.regex=^https?://(?:www\.)?${RESTAURANTE_DOMAIN}(.*)$$'
      - "traefik.http.middlewares.restaurante-canonical.redirectregex.replacement=https://${RESTAURANTE_DOMAIN}$${1}"
      - "traefik.http.middlewares.restaurante-canonical.redirectregex.permanent=true"

  # API propia (REQ-F-038; administración de productos desde REQ-F-039): solo en las redes internas db
  # (app y MySQL) y admin (inventory-manager), sin ports ni labels de Traefik: nada fuera de Docker la
  # alcanza (desviación D-3 de REQ-F-039). Usuario solo DML de la app.
  # Valor por defecto de la imagen (decisión P-2 A): los respaldos de ops/backup/ leen este archivo
  # sin conocer la API; ningún flujo arranca esa imagen (deploy.sh siempre pasa el digest real).
  api:
    image: ${RESTAURANTE_API_IMAGE:-ghcr.io/orvigas/restaurante-api:sin-desplegar}
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3001"
      DATABASE_URL: mysql://restaurante_app:${RESTAURANTE_DB_APP_PASSWORD:?Falta RESTAURANTE_DB_APP_PASSWORD en .env}@mysql:3306/restaurante
      # Solo la pone deploy.sh al volver a la versión anterior (D-1); nunca en .env.
      DATABASE_ALLOW_NEWER_SCHEMA: ${DATABASE_ALLOW_NEWER_SCHEMA:-false}
      BUSINESS_TIMEZONE: ${BUSINESS_TIMEZONE:-America/Mexico_City}
      # Aviso interno a la app tras cada escritura de productos (REQ-F-039, RF-13).
      LANDING_INTERNAL_URL: http://app:3002
      INTERNAL_NOTIFY_TOKEN: ${RESTAURANTE_INTERNAL_NOTIFY_TOKEN:?Falta RESTAURANTE_INTERNAL_NOTIFY_TOKEN en .env}
    networks:
      - db
      - admin
    depends_on:
      mysql:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
    restart: unless-stopped
    # Sobrescribe el HEALTHCHECK de la imagen: cada 2 s mientras arranca (la conexión a la base puede
    # tardar hasta 60 s) y cada 30 s después.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3001/api/v1/public/birria/productos || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
      start_interval: 2s
    logging: *logging

  # Admin nuevo (REQ-F-039): Koa con SSR en admin.<dominio>. Solo en traefik (entrada) y en la red
  # interna admin (para llegar a la api): no alcanza MySQL. Como cualquier contenedor de traefik-public,
  # podría llegar a la app por esa red, pero el aviso interno exige la credencial, que no recibe. Sin
  # credenciales de la base. Valor por defecto de la imagen como el de la api (los respaldos de ops/backup/
  # leen este archivo sin conocerla; deploy.sh siempre pasa el digest real).
  inventory-manager:
    image: ${RESTAURANTE_INVENTORY_IMAGE:-ghcr.io/orvigas/restaurante-inventory-manager:sin-desplegar}
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3003"
      TRUST_PROXY: "true"
      API_INTERNAL_URL: http://api:3001
    networks:
      - admin
      - traefik
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
    restart: unless-stopped
    # /salud responde también por HTTP (el healthcheck no pasa por Traefik) y no llama a la api.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3003/salud || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 2s
    logging: *logging
    labels:
      - "traefik.enable=true"
      # Imprescindible: está en dos redes y Traefik solo llega por traefik-public.
      - "traefik.docker.network=traefik-public"
      - "traefik.http.services.restaurante-inventory.loadbalancer.server.port=3003"
      # HTTPS en el subdominio del admin (RF-18), con su propio límite por IP: 60 por minuto y ráfaga de 60.
      - "traefik.http.routers.restaurante-inventory.rule=Host(`${RESTAURANTE_ADMIN_DOMAIN:?Falta RESTAURANTE_ADMIN_DOMAIN en .env}`)"
      - "traefik.http.routers.restaurante-inventory.entrypoints=${TRAEFIK_ENTRYPOINT_HTTPS:-websecure}"
      - "traefik.http.routers.restaurante-inventory.tls=true"
      - "traefik.http.routers.restaurante-inventory.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}"
      - "traefik.http.routers.restaurante-inventory.middlewares=restaurante-inventory-ratelimit"
      - "traefik.http.routers.restaurante-inventory.service=restaurante-inventory"
      - "traefik.http.middlewares.restaurante-inventory-ratelimit.ratelimit.average=60"
      - "traefik.http.middlewares.restaurante-inventory-ratelimit.ratelimit.period=1m"
      - "traefik.http.middlewares.restaurante-inventory-ratelimit.ratelimit.burst=60"
      # http -> 301 a https en el subdominio, aunque Traefik no tenga redirección global.
      - "traefik.http.routers.restaurante-inventory-http.rule=Host(`${RESTAURANTE_ADMIN_DOMAIN}`)"
      - "traefik.http.routers.restaurante-inventory-http.entrypoints=${TRAEFIK_ENTRYPOINT_HTTP:-web}"
      - "traefik.http.routers.restaurante-inventory-http.middlewares=restaurante-inventory-https"
      - "traefik.http.routers.restaurante-inventory-http.service=restaurante-inventory"
      - "traefik.http.middlewares.restaurante-inventory-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.restaurante-inventory-https.redirectscheme.permanent=true"

  migrate:
    image: ${RESTAURANTE_MIGRATE_IMAGE:?Falta RESTAURANTE_MIGRATE_IMAGE (la pone deploy.sh)}
    # Proceso puntual: solo con `docker compose run --rm migrate` (deploy.sh).
    profiles:
      - migrate
    environment:
      MIGRATION_DATABASE_URL: mysql://restaurante_migrator:${RESTAURANTE_DB_MIGRATOR_PASSWORD:?Falta RESTAURANTE_DB_MIGRATOR_PASSWORD en .env}@mysql:3306/restaurante
    networks:
      - db
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *logging

networks:
  # Solo app, api, migrate y MySQL; sin salida a internet.
  db:
    internal: true
  # Solo api e inventory-manager (REQ-F-039): el admin nuevo llega a la api sin ver MySQL.
  admin:
    internal: true
  traefik:
    external: true
    name: traefik-public

volumes:
  mysql-data:
  app-data:
