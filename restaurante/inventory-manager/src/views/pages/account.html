<h1 class="font-headline text-3xl font-black tracking-tight uppercase">Mi cuenta</h1>
      {{{ notices }}}
      <section class="account-panel mt-6 rounded-2xl border border-rim bg-surface p-4 md:p-6" aria-labelledby="account-data-title">
        <h2 id="account-data-title" class="font-headline text-lg font-bold">Tus datos</h2>
        <dl class="account-panel__data mt-2 grid grid-cols-[auto_1fr] gap-x-2 text-masa">
          <dt class="font-semibold">Nombre:</dt>
          <dd class="break-words">{{ name }}</dd>
          <dt class="font-semibold">Rol:</dt>
          <dd>{{ role }}</dd>
          <dt class="font-semibold">Negocios:</dt>
          <dd>{{ businesses }}</dd>
        </dl>
      </section>
      <form id="user-form" class="user-form mt-6 space-y-6" method="post" action="/cuenta" novalidate data-submit-guard>
        <input type="hidden" name="_csrf" value="{{ csrfToken }}" />
        {{{ sections }}}
        <div class="user-form__actions flex flex-wrap items-center gap-3">{{{ submit }}}</div>
      </form>
