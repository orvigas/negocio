<p><a class="font-semibold text-maiz underline underline-offset-4" href="/inventario/articulos">Volver a artículos</a></p>
      <div class="inventory-item__head mt-4 flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between">
        <div class="min-w-0">
          <p class="font-label text-xs font-bold tracking-widest text-masa uppercase">Artículo del inventario</p>
          <h1 class="font-headline text-3xl font-black tracking-tight break-words uppercase">{{ name }}</h1>
          <p class="mt-1 text-masa">Estado: <span class="inventory-item__state inventory-item__state--{{ stateModifier }} font-semibold {{ stateClass }}">{{ state }}</span></p>
        </div>
        <div class="inventory-item__actions flex flex-wrap items-center gap-2">
          <ul class="flex flex-wrap gap-2">{{{ actions }}}
          </ul>{{{ reactivate }}}
        </div>
      </div>
      {{{ notices }}}
      <section class="inventory-item__data mt-6 rounded-2xl border border-rim bg-surface p-4 md:p-6" aria-labelledby="datos">
        <h2 id="datos" class="font-headline text-lg font-bold">Datos</h2>
        <dl class="inventory-item__list mt-3 grid gap-x-4 gap-y-2 sm:grid-cols-[auto_1fr]">{{{ data }}}
        </dl>
      </section>
