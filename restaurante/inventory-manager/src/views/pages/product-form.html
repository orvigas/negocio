<p><a class="font-semibold text-maiz underline underline-offset-4" href="{{ backHref }}">Volver a productos</a></p>
      <h1 class="mt-4 font-headline text-3xl font-black tracking-tight break-words uppercase">{{ title }}</h1>
      {{{ notices }}}
      <form id="product-form" class="product-form mt-6 space-y-6" method="post" action="{{ action }}" novalidate data-submit-guard>
        <input type="hidden" name="_csrf" value="{{ csrfToken }}" />{{{ hidden }}}
        {{{ sections }}}
        <div class="product-form__actions flex flex-wrap items-center gap-3">{{{ buttons }}}
          <a class="button button--ghost inline-flex min-h-11 cursor-pointer items-center justify-center rounded-lg px-3 py-2 font-label text-sm font-bold tracking-wider text-maiz uppercase hover:bg-surface-high" href="{{ backHref }}">Cancelar</a>
        </div>
      </form>
