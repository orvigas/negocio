
        <form class="bot-switch mt-4 grid gap-3 md:grid-cols-[minmax(0,1fr)_auto] md:items-end" method="post" action="{{ action }}" data-submit-guard>
          <input type="hidden" name="_csrf" value="{{ csrfToken }}" />
          <input type="hidden" name="accion" value="{{ value }}" />{{{ reason }}}
          <button class="button {{ buttonModifier }} inline-flex min-h-11 cursor-pointer items-center justify-center rounded-lg border-[1.5px] px-4 py-2 font-label text-sm font-bold tracking-wider uppercase {{ buttonClass }}" type="submit" data-busy-text="{{ busyText }}">{{ label }}</button>
        </form>
