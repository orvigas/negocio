
            <div class="field {{ span }}">
              <label class="field__label block font-label text-xs font-bold tracking-wider text-masa uppercase" for="{{ id }}">{{ label }}{{ optional }}</label>
              <input class="field__input mt-1 block w-full rounded-lg border-[1.5px] border-outline bg-brasa text-crema placeholder:text-placeholder focus:border-adobo focus:ring-0 aria-invalid:border-error" id="{{ id }}" name="{{ name }}" type="text" value="{{ value }}"{{{ attrs }}} />{{{ help }}}{{{ error }}}
            </div>
