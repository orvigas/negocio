
                  <fieldset class="quote-field quote-field--active sm:col-span-2 lg:col-span-3">
                    <legend class="field__label font-label text-xs font-bold tracking-wider text-masa uppercase">{{ label }}{{{ marks }}}</legend>
                    <div class="mt-1 flex flex-wrap gap-x-6">
                      <label class="inline-flex min-h-11 cursor-pointer items-center gap-2 text-crema"><input class="size-5 border-[1.5px] border-adobo bg-surface-high text-chile focus:ring-0" id="{{ id }}" name="{{ name }}" type="radio" value="1"{{{ onChecked }}}{{{ attrs }}} /> Activo</label>
                      <label class="inline-flex min-h-11 cursor-pointer items-center gap-2 text-crema"><input class="size-5 border-[1.5px] border-adobo bg-surface-high text-chile focus:ring-0" id="{{ id }}-0" name="{{ name }}" type="radio" value="0"{{{ offChecked }}}{{{ attrs }}} /> Inactivo</label>
                    </div>{{{ error }}}
                  </fieldset>
