<div class="quote-matrix mt-6">
            <h3 id="quote-matrix-title" class="font-headline text-lg font-bold">Matriz de volumen</h3>
            <p class="mt-1 text-sm text-masa">Precio por persona y margen real de los paquetes activos.</p>
            <div class="quote-matrix__scroll mt-3 overflow-x-auto rounded-2xl border border-rim" role="region" aria-labelledby="quote-matrix-title" tabindex="0">
              <table class="quote-matrix__table w-full border-collapse text-sm">
                <caption class="sr-only">Precio por persona y margen real según el número de personas</caption>
                <thead class="bg-surface-high">
                  <tr>
                    <th class="px-3 py-2 text-left font-label text-xs font-bold tracking-wider text-masa uppercase" scope="col">Personas</th>{{{ heads }}}
                  </tr>
                </thead>
                <tbody>{{{ rows }}}
                </tbody>
              </table>
            </div>
          </div>
