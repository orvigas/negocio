
            <article class="quote-package rounded-2xl border border-rim bg-surface p-4 md:p-6" aria-labelledby="{{ id }}">
              <h3 id="{{ id }}" class="quote-package__name font-headline text-lg font-bold">{{ name }}</h3>
              <p class="quote-package__price mt-1 font-label text-3xl font-bold text-maiz">{{ price }} <span class="text-sm font-medium text-masa">{{ priceUnit }}</span></p>
              <p class="quote-package__source mt-1 text-sm text-masa">{{ source }}</p>
              <dl class="quote-package__details mt-3 grid grid-cols-[minmax(0,1fr)_auto] gap-x-4 gap-y-1 text-sm">{{{ rows }}}
              </dl>
            </article>
