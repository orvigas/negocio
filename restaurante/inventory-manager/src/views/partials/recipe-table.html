            <caption id="{{ captionId }}" class="recipe-table__caption px-3 py-2 text-left font-label text-xs font-bold tracking-wider text-masa uppercase">{{ caption }}</caption>
            <thead class="bg-surface-high">
              <tr>{{{ head }}}

            </thead>

          </table>
        </div>
