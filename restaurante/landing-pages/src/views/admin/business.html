<h1 class="text-2xl font-bold text-slate-900">{{ title }}</h1>
      <p class="admin__last-change mt-1 mb-6 text-sm text-slate-700">{{ lastChange }}</p>
      {{{ notices }}}
      {{{ products }}}
      <h2 id="page-form-title" class="mt-10 mb-4 text-xl font-bold text-slate-900">Hero, texto destacado y promociones</h2>
      <form id="admin-form" class="admin-form space-y-6" method="post" action="{{ action }}" aria-labelledby="page-form-title" novalidate>
        <input type="hidden" name="_csrf" value="{{ csrfToken }}" />
        <input type="hidden" name="expectedVersion" value="{{ expectedVersion }}" />
        {{{ conflict }}}
        <fieldset class="admin-form__data space-y-6"{{{ dataAttrs }}}>
          <legend class="sr-only">Datos de la página</legend>{{{ sections }}}
        </fieldset>
        {{{ submit }}}
      </form>
      {{{ restore }}}
