<h1 class="text-2xl font-bold text-slate-900">{{ title }}</h1>
      <p class="admin__last-change mt-1 mb-6 text-sm text-slate-700">{{ lastChange }}</p>
      {{{ notices }}}
      <section class="admin-confirm rounded-lg border border-slate-300 bg-white p-4 shadow-xs sm:p-6" aria-labelledby="confirm-title">
        <h2 id="confirm-title" class="text-lg font-bold text-slate-900">¿Restaurar la versión anterior?</h2>
        <p class="mt-1 text-sm text-slate-700">La versión actual pasará a ser la versión anterior, así que podrás deshacer este cambio de la misma forma. El cambio queda en el registro.</p>
        <form class="mt-4 flex flex-col gap-4 sm:flex-row sm:items-end" method="post" action="{{ action }}">
          <input type="hidden" name="_csrf" value="{{ csrfToken }}" />
          <button class="admin-button admin-button--primary {{ primaryButtonClass }}" type="submit">Sí, restaurar</button>
          <a class="admin-button admin-button--secondary {{ secondaryButtonClass }}" href="{{ cancelHref }}">Cancelar</a>
        </form>
      </section>
