
            <tr class="admin-products__row">
              <th scope="row" class="px-3 py-2 font-semibold text-slate-900">{{ name }}</th>
              <td class="px-3 py-2">{{ category }}</td>
              <td class="px-3 py-2">{{ deletedAt }}</td>
              <td class="px-3 py-2">
                <form class="admin-products__restore" method="post" action="{{ action }}">
                  <input type="hidden" name="_csrf" value="{{ csrfToken }}" />
                  <input type="hidden" name="version" value="{{ version }}" />
                  <button class="admin-button admin-button--secondary {{ buttonClass }}" type="submit">Recuperar<span class="sr-only"> {{ name }}</span></button>
                </form>
              </td>
            </tr>
