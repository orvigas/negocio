<div class="mb-6 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
        <h1 class="text-2xl font-bold text-slate-900">Usuarios</h1>
        <a class="admin-button admin-button--primary {{ primaryButtonClass }}" href="/admin/usuarios/nuevo">Crear usuario</a>
      </div>
      {{{ notices }}}
      <div class="admin-users relative overflow-x-auto rounded-lg border border-slate-300 bg-white shadow-xs">
        <table class="admin-users__table w-full text-left text-sm">
          <caption class="sr-only">Usuarios de la administración</caption>
          <thead class="bg-slate-50 text-slate-800">
            <tr>
              <th scope="col" class="px-3 py-2 font-semibold">Usuario</th>
              <th scope="col" class="px-3 py-2 font-semibold">Nombre</th>
              <th scope="col" class="px-3 py-2 font-semibold">Rol</th>
              <th scope="col" class="px-3 py-2 font-semibold">Negocios</th>
              <th scope="col" class="px-3 py-2 font-semibold">Estado</th>
              <th scope="col" class="px-3 py-2 font-semibold">Último acceso</th>
              <th scope="col" class="px-3 py-2 font-semibold">Acciones</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-slate-200">{{{ rows }}}
          </tbody>
        </table>
      </div>
