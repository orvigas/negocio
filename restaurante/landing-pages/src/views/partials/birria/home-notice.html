<dialog class="home-notice m-auto w-[calc(100%-2rem)] max-w-md max-h-[calc(100dvh-2rem)] overflow-y-auto rounded-2xl border-0 border-t-[1.5px] border-t-[#c2410c] bg-[#3d2621] p-6 text-cream shadow-[0_16px_40px_-8px_rgba(0,0,0,0.85)] backdrop:bg-black/75 sm:p-8" data-home-notice="{{ variant }}" aria-labelledby="home-notice-title">
  <h2 class="home-notice__title font-headline text-2xl leading-tight font-black text-amber-light sm:text-3xl" id="home-notice-title">{{ notice.title }}</h2>
  <p class="home-notice__body mt-4 font-body text-base leading-relaxed text-cream-muted">{{ notice.body }}</p>
  <div class="home-notice__actions mt-6 flex flex-col gap-3">
    {{{ action }}}
    <button class="home-notice__close w-full rounded-full border border-cream/50 px-5 py-2.5 font-label text-sm font-bold tracking-wider text-cream uppercase transition-colors hover:bg-cream/10 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-amber-light" type="button" data-action="close-home-notice">{{ notice.closeLabel }}</button>
  </div>
</dialog>
