<a class="home-notice__action home-notice__action--logo flex items-center justify-center gap-3 rounded-full bg-secondary-container px-5 py-2 font-label-lg text-label-lg tracking-wider text-on-secondary uppercase shadow-[0_4px_16px_rgba(243,163,0,0.35)] transition-colors hover:bg-secondary focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-secondary" href="{{ notice.href }}">
  <img class="home-notice__logo h-10 w-auto shrink-0 rounded-full bg-white/90 p-0.5" src="{{ notice.logo.src }}" alt="{{ notice.logo.alt }}" width="{{ notice.logo.width }}" height="{{ notice.logo.height }}" />
  <span>{{ notice.linkLabel }}</span>
</a>
