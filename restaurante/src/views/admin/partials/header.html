<header class="admin__header border-b border-slate-300 bg-white">
      <div class="mx-auto flex max-w-4xl flex-col gap-3 px-4 py-3 sm:flex-row sm:items-center sm:justify-between sm:px-6">
        <p class="admin__brand text-base font-bold text-slate-900">Administración de menús</p>
        <nav class="admin-nav" aria-label="Negocios">
          <ul class="flex flex-wrap items-center gap-2">{{{ links }}}
            <li>
              <form class="admin-nav__logout" method="post" action="/admin/logout">
                <input type="hidden" name="_csrf" value="{{ csrfToken }}" />
                <button class="admin-button admin-button--secondary {{ secondaryButtonClass }}" type="submit">Cerrar sesión</button>
              </form>
            </li>
          </ul>
        </nav>
      </div>
    </header>
