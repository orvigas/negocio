<div class="admin-notice admin-notice--warning {{ toneClass }} rounded-md border-l-4 p-4" role="alert">
          <p class="admin-notice__title font-bold">El producto cambió mientras lo editabas</p>
          <p class="mt-1 text-sm">{{ detail }} No se guardó nada. {{ keep }}</p>
          <div class="mt-4 flex flex-col gap-4 sm:flex-row sm:items-end">
            <button class="admin-button admin-button--primary {{ primaryButtonClass }}" type="submit" name="action" value="{{ action }}">{{ confirmLabel }}</button>
            <a class="admin-button admin-button--secondary {{ secondaryButtonClass }}" href="{{ discardHref }}">{{ discardLabel }}</a>
          </div>
        </div>
