
                <tr class="admin-products__row">
                  <td class="px-3 py-2">{{ position }}</td>
                  <th scope="row" class="px-3 py-2 font-semibold text-slate-900">{{ name }}</th>
                  <td class="px-3 py-2">{{ price }}</td>
                  <td class="px-3 py-2">{{ available }}</td>
                  <td class="px-3 py-2">
                    <div class="flex flex-wrap items-center gap-2">
                      <a class="admin-products__action font-semibold text-blue-900 underline underline-offset-4 focus-visible:outline-3 focus-visible:outline-blue-700" href="{{ editHref }}">Editar<span class="sr-only"> {{ name }}</span></a>{{{ moves }}}
                      <a class="admin-products__action font-semibold text-red-800 underline underline-offset-4 focus-visible:outline-3 focus-visible:outline-blue-700" href="{{ deleteHref }}">Eliminar<span class="sr-only"> {{ name }}</span></a>
                    </div>
                  </td>
                </tr>
