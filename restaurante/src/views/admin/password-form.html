<h1 class="text-2xl font-bold text-slate-900">{{ title }}</h1>
      <p class="mt-1 mb-6 text-sm text-slate-700">{{ intro }}</p>
      {{{ notices }}}
      <form class="admin-password-form space-y-4 rounded-lg border border-slate-300 bg-white p-4 shadow-xs sm:p-6" method="post" action="{{ action }}" novalidate>
        <input type="hidden" name="_csrf" value="{{ csrfToken }}" />
        <div class="grid gap-4 sm:grid-cols-2">{{{ fields }}}
        </div>
        <div class="flex flex-col gap-3 sm:flex-row sm:items-center">
          <button class="admin-button admin-button--primary {{ primaryButtonClass }}" type="submit">{{ submitLabel }}</button>
          {{{ cancel }}}
        </div>
      </form>
