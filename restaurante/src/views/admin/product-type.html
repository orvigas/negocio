<h1 class="text-2xl font-bold text-slate-900">{{ title }}</h1>
      <p class="mt-1 mb-6 text-sm text-slate-700"><a class="font-semibold text-blue-900 underline underline-offset-4 focus-visible:outline-3 focus-visible:outline-blue-700" href="{{ backHref }}">Volver a {{ businessName }}</a></p>
      <form class="admin-form space-y-6 rounded-lg border border-slate-300 bg-white p-4 shadow-xs sm:p-6" method="get" action="{{ action }}">
        <input type="hidden" name="categoria" value="platillo" />
        <fieldset class="space-y-3">
          <legend class="text-lg font-bold text-slate-900">¿Qué bloque de detalle tendrá la tarjeta?</legend>
          <p class="text-sm text-slate-700">No se puede cambiar después de crear el producto.</p>{{{ options }}}
        </fieldset>
        <button class="admin-button admin-button--primary {{ primaryButtonClass }}" type="submit">Continuar</button>
      </form>
