<h1 class="text-2xl font-bold text-slate-900">{{ title }}</h1>
      <p class="mt-1 mb-6 text-sm text-slate-700"><a class="font-semibold text-blue-900 underline underline-offset-4 focus-visible:outline-3 focus-visible:outline-blue-700" href="/admin/usuarios">Volver a la lista de usuarios</a></p>
      {{{ notices }}}
      <form class="admin-user-form space-y-6 rounded-lg border border-slate-300 bg-white p-4 shadow-xs sm:p-6" method="post" action="{{ action }}" novalidate>
        <input type="hidden" name="_csrf" value="{{ csrfToken }}" />
        <div class="grid gap-4 sm:grid-cols-2">{{{ fields }}}
        </div>
        {{{ businesses }}}
        {{{ passwords }}}
        <button class="admin-button admin-button--primary {{ primaryButtonClass }}" type="submit">{{ submitLabel }}</button>
      </form>
