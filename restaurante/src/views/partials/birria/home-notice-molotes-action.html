<a class="home-notice__action home-notice__action--logo flex items-center justify-center gap-3 rounded-full bg-linear-to-r from-amber-glow to-amber-500 px-5 py-2.5 font-label text-sm font-bold tracking-wider text-[#4a0808] uppercase shadow-md shadow-black/40 transition-transform hover:scale-[1.02] active:scale-95 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-amber-light" href="{{ notice.linkHref }}">
  <img class="home-notice__logo h-10 w-auto shrink-0 rounded-full bg-cream/90 p-0.5" src="{{ notice.logo.src }}" alt="{{ notice.logo.alt }}" width="{{ notice.logo.width }}" height="{{ notice.logo.height }}" />
  <span>{{ notice.linkLabel }}</span>
</a>
