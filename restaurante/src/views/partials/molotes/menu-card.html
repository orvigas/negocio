<li>
            <article class="menu-card group flex h-full flex-col overflow-hidden rounded-2xl border border-[rgb(219,234,254)] bg-white shadow-md transition-all duration-300 hover:-translate-y-1 hover:shadow-xl">
              <div class="menu-card__media relative h-48 w-full overflow-hidden bg-slate-100">
                <img class="h-full w-full object-cover transition-transform duration-500 group-hover:scale-110" src="{{ image.src }}" alt="{{ image.alt }}" width="{{ image.width }}" height="{{ image.height }}" loading="lazy" />
                <span class="menu-card__badge absolute top-space-xs left-space-xs rounded-full px-space-xs py-0.5 font-label-sm text-[9px] font-bold uppercase shadow-md {{ badgeClass }}">{{ badge }}</span>
              </div>
              <div class="menu-card__body flex flex-1 flex-col justify-between p-space-md">
                <div>
                  <div class="mb-space-xs flex items-baseline justify-between">
                    <h3 class="font-title-md text-[18px] leading-snug font-bold text-[#081830]">{{ name }}</h3>
                  </div>
                  <p class="menu-card__prices mb-space-xs flex items-center gap-space-xs font-label-md font-bold">
                    <span class="text-[#b45309]">{{ unitPrice }}</span><span class="font-normal text-outline" aria-hidden="true">•</span><span class="text-[#0369a1]">{{ orderPrice }}</span>
                  </p>
                  <p class="mb-space-md font-body-md text-body-md text-[#334155]">{{ description }}</p>
                </div>
              </div>
            </article>
          </li>
